<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign Up</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ">
        <div class="container">
          <a class="navbar-brand" href="#">Home</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="../index.html">Log in</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="Sign Up.html">sign Up</a>
              </li>
      </ul>
          </div>
        </div>
      </nav>
    <div class="py-5">
        <div class="container">
            <div class="row gy-3">
               
                <div class="col-8 m-auto shadow  p-3 mb-5">
                        <h1 class="text-center  py-3">Smart sign Up System</h1>
                        <div class="row">

                            <div class="col-md-12 py-3">
                                <input type="email" class="form-control bg-transparent " name="email" placeholder="email" id="email">
                            </div>
                            <div class="col-md-12 py-3">
                                <input type="text" class="form-control  bg-transparent " name="name" placeholder="name" id="name">
                            </div>
                            <div class="col-6 py-3">
                                <input type="password" class="form-control  bg-transparent " name="password" placeholder="Password" id="password">
                            </div>
                            <div class="col-6 py-3">
                                <input type="password" class="form-control  bg-transparent " name="rePassword" placeholder="rePassword" id="rePassword">
                            </div>
                            <div class="col-md-12 py-3">
                                <input type="tel" class="form-control  bg-transparent " name="phone" placeholder="phone" id="phone">
                            </div>
                            <div class="col-12 py-3">
                                <button class="btn btn-outline-info" id="btn">sign up</button>
                            </div>
                            <p class="text-danger text-center m-3"  id="exist"> </p>
                        </div>
                    
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/style.js"></script>
</body>
</html>
